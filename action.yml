name: 'Universal Version Bump'
description: 'A GitHub Action to bump versions across Node, Python, PHP, Java, .NET, Ruby, Dart, and more'
author: 'Taj'
branding:
  icon: 'chevrons-up'
  color: 'blue'

inputs:
  release_type:
    description: 'Select the version bump type (patch, minor, major)'
    required: true
    default: 'patch'
  git_tag:
    description: 'Whether to create a Git tag after bump'
    required: false
    default: 'false'
  target_platform:
    description: 'Explicitly specify the platform to update (e.g., node, python, java, dotnet, ruby, dart). If not provided, the platform will be detected automatically.'
    required: false
    default: ''
  target_path:
    description: 'The target path where the version bump should be applied. If not provided, the action will run in the root directory.'
    required: false
    default: '.'
  changelog_path:
    description: 'The path to the changelog file.'
    required: false
    default: 'CHANGELOG.md'
  changelog_mode:
    description: 'Whether to create a missing changelog file (auto) or fail (fail).'
    required: false
    default: 'auto'
  bump_targets:
    description: |
      Optional list of version update targets.
      Provide the `path` and the `variable` to update, the Action will build regex automatically.
      Example:
      '[{"path": "setup.py", "variable": "version"}, {"path": "Dockerfile", "variable": "APP_VERSION"}]'
    required: false
    default: '[]'
outputs:
  new_version:
    description: 'The new bumped version'
  tag:
    description: 'The created Git tag (if enabled)'

runs:
  using: 'node20'
  main: 'dist/index.js'
