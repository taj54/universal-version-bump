
name: Tag After Merge

permissions:
  contents: write

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get new version from package.json
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' package.json)

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid stable version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest stable tag
        id: last_tag
        shell: bash
        run: |
          LAST_TAG=$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)

          LAST_VERSION="${LAST_TAG#v}"

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
            LAST_VERSION="0.0.0"
          fi

          echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$LAST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release type
        id: release_type
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          OLD_VERSION: ${{ steps.last_tag.outputs.version }}
        run: |
          IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$NEW_VERSION"
          IFS='.' read -r OLD_MAJOR OLD_MINOR OLD_PATCH <<< "$OLD_VERSION"

          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            echo "::error::Version $NEW_VERSION has already been released."
            exit 1
          fi

          if [ "$NEW_MAJOR" -gt "$OLD_MAJOR" ]; then
            TYPE="major"
          elif [ "$NEW_MINOR" -gt "$OLD_MINOR" ]; then
            TYPE="minor"
          else
            TYPE="patch"
          fi

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Release type: $TYPE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ steps.release_type.outputs.type }}
        shell: bash
        run: |
          awk "/^## v${VERSION}[[:space:]]/{flag=1; next} /^## /{flag=0} flag" \
            CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::No changelog entry found for v${VERSION}"
            echo "Release v${VERSION}" > RELEASE_NOTES.md
          fi

          {
            echo "## ${RELEASE_TYPE^} Release"
            echo ""
            cat RELEASE_NOTES.md
          } > FINAL_NOTES.md

      - name: Create and push version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: FINAL_NOTES.md
          make_latest: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update floating major tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MAJOR_TAG="v${MAJOR}"

          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push origin "$MAJOR_TAG" --force

          echo "Updated floating tag: $MAJOR_TAG"

      - name: Add release summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ steps.release_type.outputs.type }}
        shell: bash
        run: |
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/edit/v${VERSION}"

          {
            echo "## 🚀 Release Published"
            echo ""
            echo "- **Version:** v${VERSION}"
            echo "- **Type:** ${RELEASE_TYPE}"
            echo "- **Floating tag:** v$(echo "$VERSION" | cut -d. -f1)"
            echo ""
            echo "### GitHub Marketplace"
            echo ""
            echo "GitHub Releases are automated. Marketplace submission/update"
            echo "still requires manual confirmation through GitHub's UI."
            echo ""
            echo "[Open release edit page](${RELEASE_URL})"
            echo ""
            echo "If this Action is eligible for Marketplace publishing,"
            echo "review and check the Marketplace publishing option, then save."
          } >> "$GITHUB_STEP_SUMMARY"
